[project]
name = "tokagotchi"
version = "0.1.0"
description = "Raise your own AI on a single GPU. Codex GPT-5.6 Sol evolves and trains a local Qwen3.6 27B via prompt evolution, distillation, and RL, with Claude Opus 5 kept as an optional provider."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",           # Ollama/OpenAI-compatible client for local serving helpers
    "pydantic>=2.0",         # Config & data models
    "pyyaml>=6.0",           # Config loading
    "docker>=7.0",           # Docker container management
    "rich>=13.0",            # Terminal output
    "wandb>=0.16",           # Experiment tracking
    "numpy>=1.26",           # Numerical ops
    "jsonlines>=4.0",        # JSONL read/write
    "aiohttp>=3.9",          # Async HTTP (Ollama health checks)
]

[project.optional-dependencies]
training = [
    "torch>=2.4",
    "transformers>=4.45",
    "unsloth",              # Loop 2 SFT trainer and supported 4-bit loading path
    "peft>=0.13",            # QLoRA adapters
    "trl>=0.12",             # RL training (GRPO)
    "accelerate>=0.34",      # Training utilities
    "datasets>=3.0",         # Dataset handling
]
serving = [
    "vllm>=0.6",             # LLM serving
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
test = [
    "pytest>=8.0",
]
dspy = [
    "dspy-ai>=2.6",
]

[project.scripts]
qsi-loop1 = "scripts.run_loop1:main"
qsi-loop2 = "scripts.run_loop2:main"
qsi-loop3 = "scripts.run_loop3:main"
qsi-all = "scripts.run_all:main"
tokagotchi-flywheel = "scripts.run_usage_flywheel:main"
tokagotchi-validate-tasks = "scripts.validate_task_bank:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
