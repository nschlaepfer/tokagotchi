model:
  # Local serving model. After Loop 2 export, the orchestrator switches this
  # in memory to tokagotchi:latest while keeping base_ollama_model for merges.
  name: "qwen3.6:27b"
  base_ollama_model: "qwen3.6:27b"
  quantization: "q4_k_m"
  ollama_port: 11434
  ollama_host: "localhost"
  ollama_num_ctx: 2048
  hf_model_path: "models/Qwen3.6-27B"
  hf_model_path_27b: "models/Qwen3.6-27B"
  hf_model_path_35b_a3b: "models/Qwen3.6-35B-A3B"

opus:
  # Default teacher/judge provider.
  # Use "codex" for Codex CLI subscription auth.
  # Change to "claude" only if Claude Code is installed and paid/enabled.
  provider: "codex"
  daily_budget_usd: 9999.0
  hourly_budget_usd: 9999.0
  session_dir: "./data/opus_sessions"
  model: "gpt-5.6-sol"
  model_reasoning_effort: "medium"
  default_max_turns: 10
  default_max_budget_per_call_usd: 0.50

  # Optional Claude Code setting if provider is changed to "claude".
  # model: "claude-opus-5"
  # model_reasoning_effort: "high"

codex:
  enabled: true
  model: "gpt-5.6-sol"
  model_reasoning_effort: "medium"
  training_data_review: true
  curriculum_generation: true
  failure_diagnostics: true
  mutation_review: true
  training_review_sample_size: 20
  curriculum_batch_size: 5
  curriculum_stagnation_gens: 5

usage_flywheel:
  # Product-use loop: collect local traces from real tasks, let the local
  # student try first, and use Codex to rescue/complete failures when enabled.
  enabled: true
  trace_dir: "./data/usage_traces"
  pending_jsonl: "./data/pending.jsonl"
  privacy_mode: "local-only"
  redact_secrets: true
  codex_boost: "on_failure"
  codex_sandbox: "read-only"
  student_timeout_seconds: 120
  codex_timeout_seconds: 300
  max_student_tokens: 1024
  student_num_ctx: 2048

vram:
  total_gb: 32
  serving_allocation_gb: 16
  training_allocation_gb: 32

git:
  enabled: true
  branch_prefix: "exp"
  auto_commit: true

schedule:
  loop1_continuous: true
  loop2_trigger_threshold: 500
  loop2_diversity_min_types: 3
  loop3_start_hour: 22
  loop3_end_hour: 6
  eval_frequency_minutes: 60

paths:
  data_dir: "./data"
  prompts_dir: "./data/prompts"
  traces_dir: "./data/traces"
  pending_jsonl: "./data/pending.jsonl"
  curriculum_dir: "./data/curriculum"
  checkpoints_dir: "./data/checkpoints"
  benchmarks_dir: "./eval/benchmarks"

safety:
  # P0 posture: collect and evaluate only until canonical judge and benchmark
  # evidence proves autonomous training/promotion is trustworthy.
  allow_unsafe_host_execution: false
  enable_autonomous_sft: false
  enable_autonomous_rl: false
  enable_checkpoint_promotion: false
  allow_teacher_generated_tests: false
  gate_evidence_path: "./data/safety/truth_gate.json"
